# Isolated WireGuard lab: vps + two peers, each in its own network namespace.
#   make lab        start it
#   docker compose -f lab/compose.yml exec vps wgmon --peer 10.8.0.2=phone --peer 10.8.0.3=laptop
#   make lab-down   remove it
name: wgmon-lab

x-node: &node
  build: { context: .., dockerfile: lab/Dockerfile, target: lab, args: { VERSION: "${VERSION:-dev}" } }
  image: wgmon-lab
  cap_add: [NET_ADMIN, NET_RAW]
  volumes: [keys:/keys]

services:
  vps:
    <<: *node
    command: net.sh vps
    sysctls: { net.ipv4.ip_forward: 1 }
    healthcheck: { test: [CMD, test, -f, /keys/ready], interval: 1s, retries: 30 }

  phone:
    <<: *node
    command: net.sh client phone 10.8.0.2 1.1.1.3
    depends_on: { vps: { condition: service_healthy } }

  laptop:
    <<: *node
    command: net.sh client laptop 10.8.0.3 1.1.1.1
    depends_on: { vps: { condition: service_healthy } }

volumes:
  keys:
